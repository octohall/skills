name: Tag the skill version

# After a sync pull request is merged, tags the merge commit v<metadata.version> (for example v0.21.0), so
# `npx skills add octohall/skills@v0.21.0 --skill octohall` pins that exact copy. Tags are never moved (a ruleset).
on:
  push:
    branches: [main]
    paths: [skills/octohall/SKILL.md]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag this version once
        run: |
          set -u
          fail() { echo "::error::$1"; exit 1; }
          version=$(sed -n -E '2,30s/^  version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' skills/octohall/SKILL.md)
          case "$version" in
            "" | *[!0-9.]*) fail "can't read metadata.version" ;;
          esac
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push --quiet origin "refs/tags/$tag"
